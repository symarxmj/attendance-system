<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>教室管理</title>
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/student-list.css">
</head>
<body>
    <div th:insert="fragments/sidebar :: sidebar"></div>
    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <h2>教室管理</h2>
                <a href="/classroom/add-page" class="btn" id="btnAdd" th:if="${role != 'TEACHER'}">+ 新增教室</a>
            </div>
            <div class="filter-bar">
                <input type="text" id="filterId" placeholder="教室ID">
                <input type="text" id="filterName" placeholder="教室名称">
                <button class="btn" onclick="loadList()">查询</button>
                <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>教室名称</th>
                            <th>行数</th>
                            <th>列数</th>
                            <th>不可坐位置</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        <tr><td colspan="7" class="loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <button id="prevBtn" onclick="changePage(-1)">上一页</button>
                <span id="pageInfo">第 1 页</span>
                <button id="nextBtn" onclick="changePage(1)">下一页</button>
            </div>
        </div>
    </div>
    <script th:inline="javascript">var myRole = /*[[${role}]]*/ '';</script>
    <script src="/js/classroom-list.js"></script>
</body>
</html>
