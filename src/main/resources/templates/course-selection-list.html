<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>选课管理</title>
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/student-list.css">
</head>
<body>
    <div th:insert="fragments/sidebar :: sidebar"></div>
    <div class="main-content"><div class="container">
        <div class="page-header"><h2>选课管理</h2><a href="/course-selection/add-page" class="btn" th:if="${role != 'TEACHER'}">+ 新增选课</a></div>
        <div class="filter-bar">
            <input type="text" id="filterStudentId" placeholder="学号">
            <input type="text" id="filterCourseId" placeholder="课程编号">
            <button class="btn" onclick="loadList()">查询</button>
            <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
        </div>
        <div class="table-wrap"><table>
            <thead><tr><th>ID</th><th>学号</th><th>学生姓名</th><th>课程名称</th><th>选课时间</th><th>操作</th></tr></thead>
            <tbody id="dataTable"><tr><td colspan="6" class="loading">加载中...</td></tr></tbody>
        </table></div>
        <div class="pagination">
            <button id="prevBtn" onclick="changePage(-1)">上一页</button>
            <span id="pageInfo">第 1 页</span>
            <button id="nextBtn" onclick="changePage(1)">下一页</button>
        </div>
    </div></div>
    <script th:inline="javascript">var myRole = /*[[${role}]]*/ '';</script>
    <script src="/js/course-selection-list.js"></script>
</body>
</html>
