<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生列表</title>
    <link rel="stylesheet" href="/css/student-list.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">考勤系统</div>
        <div class="nav-user">
            <span th:text="'当前用户: ' + ${username}">当前用户</span>
            <a href="/logout">退出</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>学生列表</h2>
        </div>

        <div class="filter-bar">
            <input type="text" id="filterStudentId" placeholder="学号">
            <input type="text" id="filterStudentName" placeholder="姓名">
            <select id="filterGender">
                <option value="">全部性别</option>
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
            <button class="btn" onclick="loadStudents()">查询</button>
            <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>创建时间</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <tr><td colspan="4" class="loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <button id="prevBtn" onclick="changePage(-1)">上一页</button>
            <span id="pageInfo">第 1 页</span>
            <button id="nextBtn" onclick="changePage(1)">下一页</button>
        </div>
    </div>

    <script src="/js/student-list.js"></script>
</body>
</html>
