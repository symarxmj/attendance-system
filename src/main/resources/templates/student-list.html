<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生列表</title>
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/student-list.css">
</head>
<body>
    <div th:insert="fragments/sidebar :: sidebar"></div>

    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <h2>学生列表</h2>
                <div style="display:flex;gap:8px;">
                    <a href="/student/add-page" class="btn" id="btnAddStudent">+ 新增学生</a>
                    <a href="/student/import-page" class="btn btn-secondary" id="btnImport">批量导入</a>
                </div>
            </div>

            <div class="filter-bar">
                <input type="text" id="filterStudentId" placeholder="学号">
                <input type="text" id="filterStudentName" placeholder="姓名">
                <select id="filterGender">
                    <option value="">全部性别</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
                <input type="date" id="filterBegin" title="注册起始日期">
                <input type="date" id="filterEnd" title="注册截止日期">
                <button class="btn" onclick="loadStudents()">查询</button>
                <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>学号</th>
                            <th>姓名</th>
                            <th>性别</th>
                            <th>注册日期</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                        <tr><td colspan="5" class="loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <button id="prevBtn" onclick="changePage(-1)">上一页</button>
                <span id="pageInfo">第 1 页</span>
                <button id="nextBtn" onclick="changePage(1)">下一页</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">var myRole = /*[[${role}]]*/ '';</script>
    <script src="/js/student-list.js"></script>
</body>
</html>
